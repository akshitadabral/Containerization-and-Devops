services:
  postgres-db:
    image: postgres:15
    container_name: postgres-db3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  backend:
    image: python:3.11-slim
    container_name: backend2
    ports:
      - "8084:8000"   
    environment:
      DB_HOST: postgres-db
      DB_USER: admin
      DB_PASS: secret
    depends_on:
      - postgres-db
    command: python -m http.server 8000
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net: